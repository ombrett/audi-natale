name: AudiLightStudio
options:
  bundleIdPrefix: com.audilightstudio
  deploymentTarget:
    iOS: "16.0"
targets:
  AudiLightStudio:
    type: application
    platform: iOS
    sources:
      - App
      - BLE
      - Views
      - Persistence
      - Logic
      - Mapping
      - Hub
      - Scan3D
      - Studio3D
      - Effects
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Audi Light Studio
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        NSBluetoothAlwaysUsageDescription: Audi Light Studio usa il Bluetooth per collegarsi alla centralina LED ISP dell'auto e leggerne servizi e risposte.
        NSCameraUsageDescription: Audi Light Studio usa la fotocamera per mappare la posizione dei LED sull'auto (mappatura automatica).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audilightstudio.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_PREVIEWS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
